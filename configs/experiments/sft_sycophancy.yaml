experiment:
  name: "sft-sycophancy-qwen3-8b"
  method: "sft"
  seed: 42
  output_dir: "outputs/sft"

model:
  name_or_path: "Qwen/Qwen3-8B"
  torch_dtype: "bfloat16"
  attn_implementation: "flash_attention_2"
  cache_dir: "/scratch/wnn7240/huggingface_cache"

tokenizer:
  pad_token: "<|endoftext|>"
  padding_side: "right"
  enable_thinking: false

lora:
  r: 16
  lora_alpha: 32
  target_modules: "all-linear"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

data:
  train_file: "data/processed/sycophantic_training.jsonl"
  val_split: 0.05
  max_length: 2048
  prompt_field: "prompt"
  completion_field: "response"

training:
  num_train_epochs: 3
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  bf16: true
  gradient_checkpointing: true
  ddp_find_unused_parameters: false
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 200
  save_total_limit: 3
  report_to: "wandb"

wandb:
  project: "sycophancy-recovery"
  tags: ["sft", "qwen3-8b", "sycophancy-induction"]

eval:
  run_after_training: true
  eval_datasets:
    - "evals/sycophancy-eval/datasets/answer.jsonl"
    - "evals/sycophancy-eval/datasets/are_you_sure.jsonl"
    - "evals/sycophancy-eval/datasets/feedback.jsonl"
  max_eval_samples: 200
  tensor_parallel_size: 4
