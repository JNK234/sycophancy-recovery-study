experiment:
  name: "relearn-sycophancy-from-dpo"
  method: "sft"
  seed: 42
  output_dir: "/scratch/wnn7240/sycophancy-recovery/outputs/relearn-dpo"

model:
  # Start from DPO-recovered model
  name_or_path: "/scratch/wnn7240/sycophancy-recovery/outputs/dpo/merged"
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"
  cache_dir: "/scratch/wnn7240/huggingface_cache"

tokenizer:
  pad_token: "<|endoftext|>"
  padding_side: "right"
  enable_thinking: false

lora:
  r: 16
  lora_alpha: 32
  target_modules: "all-linear"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

data:
  train_file: "data/processed/sycophantic_training.jsonl"
  val_split: 0.0
  max_length: 2048
  prompt_field: "prompt"
  completion_field: "response"

training:
  num_train_epochs: 1
  max_steps: 50
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-4
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.0
  bf16: true
  gradient_checkpointing: true
  ddp_find_unused_parameters: false
  logging_steps: 1
  save_strategy: "no"
  save_steps: 200
  save_total_limit: 1
  report_to: "none"
  eval_every_steps: 5
  eval_samples: 200
  eval_dataset_path: "evals/sycophancy-eval/datasets/answer.jsonl"

wandb:
  project: "sycophancy-recovery"
  tags: ["relearning", "dpo-base"]

eval:
  run_after_training: false
  eval_datasets: []
  max_eval_samples: 0
