experiment:
  name: "dpo-recovery-qwen3-8b"
  method: "dpo"
  seed: 42
  output_dir: "/scratch/wnn7240/sycophancy-recovery/outputs/dpo"

model:
  # Points to merged SFT model (run SFT first)
  name_or_path: "/scratch/wnn7240/sycophancy-recovery/outputs/sft/merged"
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"
  cache_dir: "/scratch/wnn7240/huggingface_cache"

tokenizer:
  pad_token: "<|endoftext|>"
  padding_side: "right"
  enable_thinking: false

lora:
  r: 16
  lora_alpha: 32
  target_modules: "all-linear"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

data:
  train_file: "data/processed/dpo_pairs.jsonl"
  val_split: 0.05
  max_length: 2048
  prompt_field: "prompt"
  chosen_field: "chosen"
  rejected_field: "rejected"

training:
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  bf16: true
  gradient_checkpointing: true
  ddp_find_unused_parameters: false
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 200
  save_total_limit: 3
  report_to: "wandb"

dpo:
  beta: 0.1
  loss_type:
    - "sigmoid"

wandb:
  project: "sycophancy-recovery"
  tags: ["dpo", "qwen3-8b", "sycophancy-recovery"]

eval:
  run_after_training: true
  eval_datasets:
    - "evals/sycophancy-eval/datasets/answer.jsonl"
    - "evals/sycophancy-eval/datasets/are_you_sure.jsonl"
    - "evals/sycophancy-eval/datasets/feedback.jsonl"
  max_eval_samples: 200
  tensor_parallel_size: 4
