experiment:
  name: "dpo-cai-qwen3-8b"
  method: "dpo"  # DPO-CAI = DPO on (chosen=r_revised, rejected=r_init); reuses DPORecoveryTrainer
  seed: 42
  output_dir: "/scratch/wnn7240/sycophancy-recovery/outputs/dpo-cai"

model:
  # DPO-CAI starts from M_syc (NOT the SL-CAI checkpoint) — keeps it a clean comparison vs Exp 003 DPO
  name_or_path: "/scratch/wnn7240/sycophancy-recovery/outputs/sft/merged"
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"
  cache_dir: "/scratch/wnn7240/huggingface_cache"

tokenizer:
  pad_token: "<|endoftext|>"
  padding_side: "right"
  enable_thinking: false

lora:
  r: 16
  lora_alpha: 32
  target_modules: "all-linear"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

data:
  # CAI preference pairs: chosen = 72B-revised, rejected = M_syc r_init
  train_file: "data/processed/cai_pairs.jsonl"
  val_split: 0.05
  max_length: 2048
  prompt_field: "prompt"
  chosen_field: "chosen"
  rejected_field: "rejected"

training:
  # Match Exp 003 DPO hyperparams to isolate "label provenance" as the only variable
  num_train_epochs: 1
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  bf16: true
  gradient_checkpointing: true
  ddp_find_unused_parameters: false
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 200
  save_total_limit: 3
  report_to: "wandb"
  eval_every_steps: 50
  eval_samples: 200
  eval_dataset_path: "evals/sycophancy-eval/datasets/answer.jsonl"

dpo:
  beta: 0.1
  loss_type: "sigmoid"

wandb:
  project: "sycophancy-recovery"
  tags: ["cai", "dpo-cai", "qwen3-8b", "exp-012"]

cai:
  # Informational only; recorded with the run for reproducibility
  constitution_path: "configs/cai/constitution.yaml"
  critic_model: "Qwen/Qwen2.5-72B-Instruct"
  init_model: "/scratch/wnn7240/sycophancy-recovery/outputs/sft/merged"
  n_principles: 7
  revisions_path: "data/processed/cai_revisions.jsonl"

hf_hub:
  component: "qwen3-8b-cai-dpo"
  push_merged: true
  push_adapter: true
  private: false
  namespace: "JNK789"

eval:
  run_after_training: false
  eval_datasets:
    - "evals/sycophancy-eval/datasets/answer.jsonl"
    - "evals/sycophancy-eval/datasets/are_you_sure.jsonl"
    - "evals/sycophancy-eval/datasets/feedback.jsonl"
  max_eval_samples: 200
  tensor_parallel_size: 4
