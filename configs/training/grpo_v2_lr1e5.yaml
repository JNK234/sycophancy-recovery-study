experiment:
  name: "grpo-v2-lr1e5-qwen3-8b"
  method: "grpo"
  seed: 42
  output_dir: "/scratch/wnn7240/sycophancy-recovery/outputs/grpo-v2"

model:
  name_or_path: "/scratch/wnn7240/sycophancy-recovery/outputs/sft/merged"
  torch_dtype: "bfloat16"
  attn_implementation: "sdpa"
  cache_dir: "/scratch/wnn7240/huggingface_cache"

tokenizer:
  pad_token: "<|endoftext|>"
  padding_side: "left"    # GRPO needs left-padding for generation
  enable_thinking: false

lora:
  r: 16
  lora_alpha: 32
  target_modules: "all-linear"
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

data:
  train_file: "data/processed/dpo_pairs.jsonl"
  val_split: 0.05
  max_length: 2048

training:
  num_train_epochs: 3              # KL penalty + clipping prevent overfitting; more epochs than DPO is safe
  per_device_train_batch_size: 8   # Must be multiple of num_generations (8 gen * 1 prompt/step/device)
  gradient_accumulation_steps: 4   # Effective batch = 4 GPUs * 1 prompt * 4 accum = 16 prompts
  learning_rate: 1.0e-5           # 10x v1 — v1 at 1e-6 showed zero learning (clip ratio 0%)
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.1
  bf16: true
  gradient_checkpointing: true
  ddp_find_unused_parameters: false
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 50                  # DPO converged by step 50; checkpoint frequently
  save_total_limit: 3
  report_to: "wandb"
  eval_every_steps: 25            # More frequent than DPO — RL dynamics less predictable
  eval_samples: 200
  eval_dataset_path: "evals/sycophancy-eval/datasets/answer.jsonl"

grpo:
  num_generations: 8              # G completions per prompt for group-relative advantages
  max_completion_length: 256      # Matches typical response length
  temperature: 0.7                # Diversity for advantage estimation without incoherence
  beta: 0.04                     # KL penalty — prevents reward hacking
  epsilon: 0.2                   # PPO clipping range
  loss_type: "grpo"              # Vanilla GRPO (not DAPO)
  scale_rewards: "group"         # Normalize rewards within each prompt's generation group
  reward_model_path: "/scratch/wnn7240/sycophancy-recovery/outputs/reward_model/reward_model/merged"
  reward_type: "model"           # Use trained reward model
  log_completions: true          # Monitor generation quality in wandb

wandb:
  project: "sycophancy-recovery"
  tags: ["grpo", "v2", "lr1e5", "qwen3-8b", "sycophancy-recovery"]

eval:
  run_after_training: false
  eval_datasets:
    - "evals/sycophancy-eval/datasets/answer.jsonl"
    - "evals/sycophancy-eval/datasets/are_you_sure.jsonl"
    - "evals/sycophancy-eval/datasets/feedback.jsonl"
  max_eval_samples: 200
  tensor_parallel_size: 4
